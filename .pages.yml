  - name: appearance
    label: Theme & layout
    type: file
    path: site/content/appearance.json
    format: json
    fields:
      - name: appearance
        label: Theme & layout
        type: object
        required: true
        fields:
          - name: background
            label: Background
            type: string
            required: true
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
              message: 'Use a six-digit hex colour, such as #b6f16c.'
          - name: foreground
            label: Foreground
            type: string
            required: true
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
              message: 'Use a six-digit hex colour, such as #b6f16c.'
          - name: accent
            label: Accent
            type: string
            required: true
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
              message: 'Use a six-digit hex colour, such as #b6f16c.'
          - name: card
            label: Card
            type: string
            required: true
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
              message: 'Use a six-digit hex colour, such as #b6f16c.'
          - name: border
            label: Border
            type: string
            required: true
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
              message: 'Use a six-digit hex colour, such as #b6f16c.'
          - name: mutedText
            label: Secondary text colour
            type: string
            required: true
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
              message: 'Use a six-digit hex colour, such as #b6f16c.'
          - name: font
            label: Text font
            type: select
            required: true
            options:
              values:
                - label: Arial (current)
                  value: Arial, Helvetica, sans-serif
                - label: Georgia
                  value: Georgia, serif
                - label: Verdana
                  value: Verdana, sans-serif
                - label: Monospace
                  value: monospace
          - name: width
            label: Maximum page width (pixels)
            type: number
            required: true
            options:
              min: 900
              max: 1600
          - name: headingFont
            label: Heading font
            type: select
            required: true
            options:
              values:
                - label: Arial (current)
                  value: Arial, Helvetica, sans-serif
                - label: Georgia
                  value: Georgia, serif
                - label: Verdana
                  value: Verdana, sans-serif
                - label: Monospace
                  value: monospace
          - name: bodySize
            label: Body text size (pixels)
            type: number
            options:
              min: 14
              max: 22
          - name: lineHeight
            label: Body line spacing
            type: number
            options:
              min: 1.4
              max: 2.2
          - name: coverHeight
            label: Maximum cover height on large screens (pixels)
            type: number
            options:
              min: 210
              max: 650
          - name: coverOpacity
            label: Cover photo brightness (%)
            type: number
            options:
              min: 30
              max: 100
          - name: imageRadius
            label: Photo corner rounding (pixels)
            type: number
            options:
              min: 0
              max: 32
          - name: logoBackground
            label: Background behind organization logos
            type: string
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
