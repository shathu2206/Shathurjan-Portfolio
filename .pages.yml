media:
  input: site/public/assets
  output: assets
  rename: safe
  extensions:
    - png
    - jpg
    - jpeg
    - webp
    - pdf
content:
  - name: updates
    label: Engineering Updates
    type: collection
    path: site/content/posts
    format: json
    exclude:
      - .gitkeep
    subfolders: false
    filename:
      template: '{year}-{month}-{day}-{primary}.json'
      field: create
    view:
      primary: title
      sort: date
      order: desc
      fields:
        - title
        - date
        - published
    fields:
      - name: title
        label: Post title
        type: string
        required: true
      - name: date
        label: Post date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: published
        label: Show on website
        type: boolean
        required: false
        default: false
        description: >-
          Turn on when ready to publish. Saving with this off keeps the post off the website. Draft files are
          still stored in your public GitHub repository.
      - name: excerpt
        label: Short introduction
        type: text
        required: false
        description: A short preview shown in the Updates feed.
      - name: image
        label: Cover image
        type: image
        required: false
        options:
          extensions:
            - png
            - jpg
            - jpeg
            - webp
      - name: imageAlt
        label: Cover image description
        type: string
        required: false
        description: Required when a cover image is selected. Describe what the image shows.
      - name: body
        label: Your post
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          extensions:
            - png
            - jpg
            - jpeg
            - webp
        description: Write here. Type '/' to insert headings, lists or images. Select text for formatting controls.
      - name: linkedin
        label: LinkedIn post link
        type: string
        required: false
        pattern: ^https://(www\.)?linkedin\.com/
        description: 'Optional: paste a link to the same post on LinkedIn.'
  - name: contact
    label: Get in touch
    type: file
    path: site/content/contact.json
    format: json
    fields:
      - name: contact
        label: Get in touch section
        type: object
        required: true
        fields:
          - name: eyebrow
            label: Small heading (Get in touch)
            type: string
            required: true
          - name: title
            label: Main heading
            type: text
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: resume
            label: Main CV (PDF)
            type: file
            required: true
            description: Used by the introduction’s View CV button and any contact entry with type Main CV.
            options:
              extensions:
                - pdf
          - name: links
            label: Contact entries — add, remove or drag to reorder
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.label}'
            description: >-
              Add as many entries as you need: phone numbers, email addresses, websites, social profiles or
              documents.
            fields:
              - name: label
                label: Small label (for example EMAIL or GITHUB)
                type: string
                required: true
              - name: type
                label: Link type
                type: select
                required: true
                options:
                  values:
                    - label: Phone number
                      value: phone
                    - label: Email address
                      value: email
                    - label: Website or social link
                      value: link
                    - label: LinkedIn profile
                      value: linkedin
                    - label: Main CV (uses PDF above)
                      value: cv
                    - label: Another document
                      value: file
              - name: text
                label: Display text
                type: string
                required: false
                description: >-
                  Optional for phone/email: leave empty to display the number or address. For websites or
                  documents, use a name such as GitHub or View my CV.
              - name: value
                label: Phone number, email address or website URL
                type: string
                required: false
                description: >-
                  Enter the number or email normally, or paste a full https:// URL. Leave empty for Main CV or
                  Another document. The first LinkedIn profile entry also supplies the link on the Updates
                  page.
              - name: file
                label: Document
                type: file
                required: false
                description: Choose a file only when Link type is Another document.
                options:
                  extensions:
                    - pdf
  - name: gallery
    label: Gallery
    type: file
    path: site/content/gallery.json
    format: json
    fields:
      - name: gallery
        label: Gallery page
        type: object
        required: true
        fields:
          - name: eyebrow
            label: Small label above heading
            type: string
            required: true
          - name: title
            label: Page title
            type: string
            required: true
          - name: description
            label: Page introduction
            type: text
            required: true
          - name: emptyMessage
            label: Message when there are no photos
            type: text
            required: true
          - name: photos
            label: Photos — add, edit or drag to reorder
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.title}'
            description: >-
              Replace the labelled placeholders with your photos. Add a title, a short caption and an image
              description, then save.
            fields:
              - name: image
                label: Photo
                type: image
                required: true
                options:
                  extensions:
                    - png
                    - jpg
                    - jpeg
                    - webp
              - name: title
                label: Photo title
                type: string
                required: true
              - name: caption
                label: Short caption
                type: text
                required: false
              - name: alt
                label: Image description
                type: string
                required: true
                description: Describe the image for visitors using screen readers.
  - name: settings
    label: Website text & layout
    type: file
    path: site/content/settings.json
    format: json
    fields:
      - name: settings
        label: Settings
        type: object
        required: true
        fields:
          - name: branding
            label: Header and footer
            type: object
            required: true
            fields:
              - name: monogram
                label: Logo initials
                type: string
                required: true
              - name: subtitle
                label: Subtitle
                type: string
                required: true
              - name: footer
                label: Footer text
                type: text
                required: true
          - name: intro
            label: Introduction buttons
            type: object
            required: true
            fields:
              - name: workButton
                label: Work Button
                type: string
                required: true
              - name: cvButton
                label: Cv Button
                type: string
                required: true
          - name: sections
            label: Homepage sections — drag to reorder, remove to hide
            type: select
            required: false
            list: true
            description: >-
              The introduction stays at the top. Remove a section to hide it; add it back to restore it.
              Matching navigation tabs hide automatically. Content is preserved.
            options:
              values:
                - label: Projects
                  value: work
                - label: Technical experience
                  value: experience
                - label: Leadership & community
                  value: leadership
                - label: Education
                  value: education
                - label: Awards & achievements
                  value: awards
                - label: Skills
                  value: skills
                - label: Updates invitation
                  value: updates
                - label: Contact
                  value: contact
          - name: navigation
            label: Navigation tabs — drag to reorder
            type: object
            required: false
            list:
              collapsible:
                collapsed: true
                summary: '{fields.label}'
            fields:
              - name: label
                label: Tab label
                type: string
                required: true
              - name: target
                label: Destination
                type: select
                required: true
                options:
                  values:
                    - label: Introduction
                      value: intro
                    - label: Projects
                      value: work
                    - label: Technical experience
                      value: experience
                    - label: Leadership & community
                      value: leadership
                    - label: Education
                      value: education
                    - label: Awards & achievements
                      value: awards
                    - label: Skills
                      value: skills
                    - label: Updates page
                      value: updates
                    - label: Contact
                      value: contact
                    - label: Gallery page
                      value: gallery
          - name: work
            label: Projects section
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Small label above heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
              - name: contributionLabel
                label: Contribution Label
                type: string
                required: true
              - name: linkLabel
                label: Link Label
                type: string
                required: true
              - name: toolsLabel
                label: Tools Label
                type: string
                required: true
          - name: experience
            label: Experience section
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Small label above heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
          - name: leadership
            label: Leadership section
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Small label above heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
          - name: education
            label: Education section
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Small label above heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
              - name: gpaLabel
                label: Gpa Label
                type: string
                required: true
          - name: awards
            label: Awards & achievements section
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Small label above heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
          - name: skills
            label: Skills section
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Small label above heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
          - name: updates
            label: Updates invitation on homepage
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Small label above heading
                type: string
                required: true
              - name: title
                label: Heading
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
              - name: button
                label: Button
                type: string
                required: true
          - name: journal
            label: Updates page and post labels
            type: object
            required: true
            fields:
              - name: eyebrow
                label: Small label above heading
                type: string
                required: true
              - name: title
                label: Heading
                type: text
                required: true
              - name: description
                label: Description
                type: text
                required: true
              - name: emptyEyebrow
                label: Empty Eyebrow
                type: string
                required: true
              - name: emptyTitle
                label: Empty Title
                type: string
                required: true
              - name: emptyDescription
                label: Empty Description
                type: text
                required: true
              - name: asideLabel
                label: Aside Label
                type: string
                required: true
              - name: connectLabel
                label: Connect Label
                type: string
                required: true
              - name: readLabel
                label: Read Label
                type: string
                required: true
              - name: backLabel
                label: Back Label
                type: string
                required: true
              - name: byLabel
                label: By Label
                type: string
                required: true
              - name: linkedinLabel
                label: Linkedin Label
                type: string
                required: true
          - name: accessibility
            label: Navigation and accessibility labels
            type: object
            required: true
            fields:
              - name: skipLink
                label: Skip Link
                type: string
                required: true
              - name: navigation
                label: Navigation accessibility label
                type: string
                required: true
              - name: home
                label: Home
                type: string
                required: true
              - name: backToTop
                label: Back To Top
                type: string
                required: true
          - name: metadata
            label: Browser titles and search descriptions
            type: object
            required: true
            fields:
              - name: title
                label: Heading
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
              - name: updatesTitle
                label: Updates Title
                type: string
                required: true
          - name: appearance
            label: Colours, font and page width
            type: object
            required: true
            fields:
              - name: background
                label: Background
                type: string
                required: true
                pattern:
                  regex: ^#[0-9a-fA-F]{6}$
                  message: 'Use a six-digit hex colour, such as #b6f16c.'
              - name: foreground
                label: Foreground
                type: string
                required: true
                pattern:
                  regex: ^#[0-9a-fA-F]{6}$
                  message: 'Use a six-digit hex colour, such as #b6f16c.'
              - name: accent
                label: Accent
                type: string
                required: true
                pattern:
                  regex: ^#[0-9a-fA-F]{6}$
                  message: 'Use a six-digit hex colour, such as #b6f16c.'
              - name: card
                label: Card
                type: string
                required: true
                pattern:
                  regex: ^#[0-9a-fA-F]{6}$
                  message: 'Use a six-digit hex colour, such as #b6f16c.'
              - name: border
                label: Border
                type: string
                required: true
                pattern:
                  regex: ^#[0-9a-fA-F]{6}$
                  message: 'Use a six-digit hex colour, such as #b6f16c.'
              - name: mutedText
                label: Secondary text colour
                type: string
                required: true
                pattern:
                  regex: ^#[0-9a-fA-F]{6}$
                  message: 'Use a six-digit hex colour, such as #b6f16c.'
              - name: font
                label: Text font
                type: select
                required: true
                options:
                  values:
                    - label: Arial (current)
                      value: Arial, Helvetica, sans-serif
                    - label: Georgia
                      value: Georgia, serif
                    - label: Verdana
                      value: Verdana, sans-serif
                    - label: Monospace
                      value: monospace
              - name: width
                label: Maximum page width (pixels)
                type: number
                required: true
                options:
                  min: 900
                  max: 1600
  - name: profile
    label: Introduction & name
    fields:
      - name: profile
        label: Your introduction
        type: object
        fields:
          - name: name
            label: Full name
            type: string
            required: true
          - name: role
            label: Role / university
            type: string
            required: true
          - name: availability
            label: Availability banner
            type: string
            required: true
          - name: intro
            label: Introduction and About text
            type: text
            required: true
            description: >-
              Everything here appears directly below your name and role. Separate paragraphs with a blank
              line.
          - name: highlights
            label: Highlights below your introduction
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.value}'
            fields:
              - name: value
                label: Headline
                type: string
                required: true
              - name: label
                label: Supporting detail
                type: string
                required: true
          - name: languages
            label: Languages
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.language}'
            fields:
              - name: language
                label: Language
                type: string
                required: true
              - name: level
                label: Proficiency
                type: string
                required: true
    type: file
    path: site/content/profile.json
    format: json
  - name: projects
    label: Projects
    fields:
      - name: projects
        label: Featured projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        fields:
          - name: title
            label: Project title
            type: string
            required: true
          - name: id
            label: Short project name
            type: string
            required: true
            description: >-
              A unique name for the project link, e.g. wing-analysis. Keep this unchanged after sharing the
              link.
            pattern:
              regex: ^[a-z][a-z0-9-]*$
              message: Use lowercase letters, numbers and hyphens, starting with a letter.
          - name: category
            label: Category
            type: string
            required: true
          - name: organization
            label: Team / organisation
            type: string
            required: true
          - name: date
            label: Dates
            type: string
            required: true
          - name: role
            label: Your role
            type: string
            required: true
          - name: summary
            label: Project description
            type: text
            required: true
          - name: contributions
            label: What I contributed
            type: text
            list: true
          - name: outcomeLabel
            label: Result heading
            type: string
            required: true
            description: 'For example: RESULT, DESIGN APPROACH, or RESEARCH FOCUS.'
          - name: outcome
            label: Result or current progress
            type: text
            required: true
          - name: tools
            label: Tools and methods
            type: string
            list: true
          - name: images
            label: CAD renders and photos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.alt}'
            fields:
              - name: src
                label: Image
                type: image
                required: true
                options:
                  extensions:
                    - png
                    - jpg
                    - jpeg
                    - webp
              - name: alt
                label: Image description
                type: string
                required: true
                description: Describe what the image shows for visitors using screen readers.
              - name: caption
                label: Caption
                type: string
                required: false
          - name: link
            label: Project link (optional)
            type: string
            required: false
            pattern: ^https://
            description: A full https:// address, or leave empty.
        description: >-
          Add a project, open an existing card to edit it, or reorder the cards. Their order here is their
          order on the website.
    type: file
    path: site/content/projects.json
    format: json
  - name: experience
    label: Technical experience
    fields:
      - name: experience
        label: Experience entries
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        fields:
          - name: title
            label: Role
            type: string
            required: true
          - name: organization
            label: Organisation
            type: string
            required: true
          - name: date
            label: Dates
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: details
            label: Responsibilities and achievements
            type: text
            list: true
    type: file
    path: site/content/experience.json
    format: json
  - name: education
    label: Education
    fields:
      - name: education
        label: Education
        type: object
        fields:
          - name: school
            label: University
            type: string
            required: true
          - name: degree
            label: Degree
            type: string
            required: true
          - name: date
            label: Dates
            type: string
            required: true
          - name: coursework
            label: Coursework and recognition
            type: text
            required: true
          - name: gpa
            label: GPA
            type: string
            required: false
          - name: previous
            label: Previous education
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.degree}'
            fields:
              - name: degree
                label: Qualification
                type: string
                required: true
              - name: school
                label: School
                type: string
                required: true
              - name: date
                label: Dates
                type: string
                required: true
              - name: details
                label: Additional details
                type: text
                list: true
    type: file
    path: site/content/education.json
    format: json
  - name: skills
    label: Skills
    fields:
      - name: skills
        label: Skill groups
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        fields:
          - name: title
            label: Group title
            type: string
            required: true
          - name: items
            label: Skills
            type: string
            list: true
    type: file
    path: site/content/skills.json
    format: json
  - name: leadership
    label: Leadership & community
    type: file
    path: site/content/leadership.json
    format: json
    fields:
      - name: leadership
        label: Roles
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        fields:
          - name: title
            label: Role
            type: string
            required: true
          - name: organization
            label: Organisation
            type: string
            required: true
          - name: date
            label: Dates
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: details
            label: Responsibilities and achievements
            type: text
            list: true
  - name: awards
    label: Awards & achievements
    type: file
    path: site/content/awards.json
    format: json
    fields:
      - name: awards
        label: Awards
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.title}'
        fields:
          - name: title
            label: Award
            type: string
            required: true
          - name: organization
            label: Organisation / school
            type: string
            required: true
          - name: date
            label: Date / year
            type: string
            required: true
settings:
  content:
    merge: true
