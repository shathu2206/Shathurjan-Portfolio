  - name: image-filters
    label: Image appearance & sizing
    type: file
    path: site/content/image-filters.json
    format: json
    fields:
      - name: imageFilters
        label: Image settings
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.image}'
        description: >-
          Select an image file and adjust its appearance or dimensions wherever that file is used. Use one
          entry per image.
        fields:
          - name: image
            label: Image to style
            type: image
            required: true
            options:
              extensions:
                - png
                - jpg
                - jpeg
                - webp
                - svg
          - name: enabled
            label: Apply these image settings
            type: boolean
            default: true
            description: >-
              Turn off to return to the page defaults. To remove a cover’s grayscale effect, leave this on and
              choose Original colours.
          - name: effect
            label: Colour filter
            type: select
            default: inherit
            options:
              values:
                - label: Keep existing page filters (size changes only)
                  value: inherit
                - label: Original colours (no colour filter)
                  value: original
                - label: Grayscale
                  value: grayscale
                - label: Sepia
                  value: sepia
            description: >-
              Choose Keep existing page filters to change size without changing colours, brightness or
              opacity.
          - name: brightness
            label: Brightness (%)
            type: number
            default: 100
            options:
              min: 0
              max: 200
            description: 100 = normal. Lower to reduce, higher to increase.
          - name: contrast
            label: Contrast (%)
            type: number
            default: 100
            options:
              min: 0
              max: 200
            description: 100 = normal. Lower to reduce, higher to increase.
          - name: saturation
            label: Saturation (%)
            type: number
            default: 100
            options:
              min: 0
              max: 200
            description: 100 = normal. Lower to reduce, higher to increase.
          - name: opacity
            label: Opacity (%)
            type: number
            default: 100
            options:
              min: 0
              max: 100
            description: 100 = fully visible.
          - name: resize
            label: Customize image size and proportions
            type: boolean
            default: false
          - name: ratio
            label: Aspect ratio
            type: select
            default: original
            options:
              values:
                - label: Keep the current layout
                  value: original
                - label: Natural image proportions
                  value: auto
                - label: 16 / 9
                  value: 16 / 9
                - label: 3 / 2
                  value: 3 / 2
                - label: 4 / 3
                  value: 4 / 3
                - label: 1 / 1
                  value: 1 / 1
                - label: 4 / 5
                  value: 4 / 5
                - label: 9 / 16
                  value: 9 / 16
          - name: width
            label: Width within its available space (%)
            type: number
            default: 100
            options:
              min: 10
              max: 100
          - name: maxWidth
            label: Maximum width (pixels, optional)
            type: number
            options:
              min: 40
              max: 2560
            description: Leave empty for no additional limit. The image still shrinks to fit small screens.
          - name: fit
            label: Fitting when a ratio is selected
            type: select
            default: contain
            options:
              values:
                - label: Show the whole image
                  value: contain
                - label: Fill the frame (crop)
                  value: cover
          - name: position
            label: Crop position
            type: select
            default: center
            options:
              values:
                - center
                - top
                - bottom
                - left
                - right
