            label: Show this organization logo
            type: boolean
            default: true
            description: >-
              Controls the shared logo wherever it is automatically matched. A logo chosen directly on an
              individual entry is controlled by that entry.
  - name: contact
    label: Get in touch
    type: file
    path: site/content/contact.json
    format: json
    fields:
      - name: contact
        label: Get in touch section
        type: object
        required: true
        fields:
          - name: eyebrow
            label: Small heading (Get in touch)
            type: string
            required: true
          - name: title
            label: Main heading
            type: text
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: resume
            label: Main CV (PDF)
            type: file
            required: true
            description: Used by the introduction’s View CV button and any contact entry with type Main CV.
            options:
              extensions:
                - pdf
          - name: links
            label: Contact entries — add, remove or drag to reorder
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.label}'
            description: >-
              Add as many entries as you need: phone numbers, email addresses, websites, social profiles or
              documents.
            fields:
              - name: label
                label: Small label (for example EMAIL or GITHUB)
                type: string
                required: true
              - name: type
                label: Link type
                type: select
                required: true
                options:
                  values:
                    - label: Phone number
                      value: phone
                    - label: Email address
                      value: email
                    - label: Website or social link
                      value: link
                    - label: LinkedIn profile
                      value: linkedin
                    - label: Main CV (uses PDF above)
                      value: cv
                    - label: Another document
                      value: file
              - name: text
                label: Display text
                type: string
                required: false
                description: >-
                  Optional for phone/email: leave empty to display the number or address. For websites or
                  documents, use a name such as GitHub or View my CV.
              - name: value
                label: Phone number, email address or website URL
                type: string
                required: false
                description: >-
                  Enter the number or email normally, or paste a full https:// URL. Leave empty for Main CV or
                  Another document. The first LinkedIn profile entry also supplies the link on the Updates
                  page.
              - name: file
                label: Document
                type: file
                required: false
                description: Choose a file only when Link type is Another document.
                options:
                  extensions:
                    - pdf
