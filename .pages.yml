media:
  input: site/public/assets
  output: assets
  rename: safe
  extensions:
    - png
    - jpg
    - jpeg
    - webp
    - pdf
    - svg
    - mp4
    - webm
    - vtt
content:
  - name: updates
    label: Engineering Updates
    type: collection
    path: site/content/posts
    format: json
    exclude:
      - .gitkeep
    subfolders: false
    filename:
      template: '{year}-{month}-{day}-{primary}.json'
      field: create
    view:
      primary: title
      sort: date
      order: desc
      fields:
        - title
        - date
        - published
    fields:
      - name: title
        label: Post title
        type: string
        required: true
      - name: date
        label: Post date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: published
        label: Show on website
        type: boolean
        required: false
        default: false
        description: >-
          Turn on when ready to publish. Saving with this off keeps the post off the website. Draft files are
          still stored in your public GitHub repository.
      - name: excerpt
        label: Short introduction
        type: text
        required: false
        description: A short preview shown in the Updates feed.
      - name: image
        label: Cover image
        type: image
        required: false
        options:
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - svg
      - name: imageLayout
        label: Cover image — size & background
        type: object
        fields:
          - name: enabled
            label: Customize this image
            type: boolean
            default: false
            description: Applies only to this placement. Turn off to use the normal page layout.
          - name: width
            label: Width (% of available space)
            type: number
            default: 100
            options:
              min: 1
              max: 100
          - name: maxWidth
            label: Maximum width (pixels)
            type: number
            description: Optional. For example, 180 for a logo or 600 for a photo. Shrinks to fit small screens.
            options:
              min: 16
              max: 3840
          - name: ratio
            label: Aspect ratio
            type: select
            default: auto
            options:
              values:
                - value: auto
                  label: Original proportions
                - value: 16 / 9
                  label: 16 / 9
                - value: 3 / 2
                  label: 3 / 2
                - value: 4 / 3
                  label: 4 / 3
                - value: 1 / 1
                  label: 1 / 1
                - value: 4 / 5
                  label: 4 / 5
                - value: 9 / 16
                  label: 9 / 16
          - name: fit
            label: Fit
            type: select
            default: contain
            options:
              values:
                - value: contain
                  label: Show entire image
                - value: cover
                  label: Fill and crop
          - name: position
            label: Crop position
            type: select
            default: center
            options:
              values:
                - center
                - top
                - bottom
                - left
                - right
          - name: background
            label: Background behind image
            type: select
            default: transparent
            options:
              values:
                - transparent
                - white
                - dark
                - theme
            description: Transparent preserves PNG transparency. Cannot remove a background already baked into a file.
      - name: imageAlt
        label: Cover image description
        type: string
        required: false
        description: Required when a cover image is selected. Describe what the image shows.
      - name: body
        label: Your post
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          extensions:
            - png
            - jpg
            - jpeg
            - webp
        description: Write here. Type '/' to insert headings, lists or images. Select text for formatting controls.
      - name: linkedin
        label: LinkedIn post link
        type: string
        required: false
        pattern: ^https://(www\.)?linkedin\.com/
        description: 'Optional: paste a link to the same post on LinkedIn.'
  - name: intro-photos
    label: Intro photos
    type: file
    path: site/content/intro-photos.json
    format: json
    fields:
      - name: introPhotos
        label: Introduction slideshow
        type: object
        required: true
        fields:
          - name: visible
            label: Show photos beside introduction
            type: boolean
            required: true
          - name: label
            label: Slideshow description
            type: string
            required: true
          - name: autoplay
            label: Automatically change photos
            type: boolean
            required: true
          - name: intervalSeconds
            label: Seconds between photos
            type: number
            required: true
            options:
              min: 5
              max: 60
            description: >-
              15 seconds by default. Visitors can switch photos with hover arrows, photo dots, keyboard arrows
              or touch swipes.
          - name: previousLabel
            label: Previous button label
            type: string
            required: true
          - name: nextLabel
            label: Next button label
            type: string
            required: true
          - name: photoLabel
            label: Photo selection label
            type: string
            required: true
          - name: photos
            label: Photos — add, replace or drag to reorder
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.caption}'
            description: >-
              Upload your portraits, project photos or other images here. With one photo the slideshow becomes
              a still image; with no photos the space is hidden.
            fields:
              - name: image
                label: Photo
                type: image
                required: true
                options:
                  extensions:
                    - png
                    - jpg
                    - jpeg
                    - webp
                    - svg
              - name: imageLayout
                label: Photo — size & background
                type: object
                fields:
                  - name: enabled
                    label: Customize this image
                    type: boolean
                    default: false
                    description: Applies only to this placement. Turn off to use the normal page layout.
                  - name: width
                    label: Width (% of available space)
                    type: number
                    default: 100
                    options:
                      min: 1
                      max: 100
                  - name: maxWidth
                    label: Maximum width (pixels)
                    type: number
                    description: Optional. For example, 180 for a logo or 600 for a photo. Shrinks to fit small screens.
                    options:
                      min: 16
                      max: 3840
                  - name: ratio
                    label: Aspect ratio
                    type: select
                    default: auto
                    options:
                      values:
                        - value: auto
                          label: Original proportions
                        - value: 16 / 9
                          label: 16 / 9
                        - value: 3 / 2
                          label: 3 / 2
                        - value: 4 / 3
                          label: 4 / 3
                        - value: 1 / 1
                          label: 1 / 1
                        - value: 4 / 5
                          label: 4 / 5
                        - value: 9 / 16
                          label: 9 / 16
                  - name: fit
                    label: Fit
                    type: select
                    default: contain
                    options:
                      values:
                        - value: contain
                          label: Show entire image
                        - value: cover
                          label: Fill and crop
                  - name: position
                    label: Crop position
                    type: select
                    default: center
                    options:
                      values:
                        - center
                        - top
                        - bottom
                        - left
                        - right
                  - name: background
                    label: Background behind image
                    type: select
                    default: transparent
                    options:
                      values:
                        - transparent
                        - white
                        - dark
                        - theme
                    description: >-
                      Transparent preserves PNG transparency. Cannot remove a background already baked into a
                      file.
              - name: alt
                label: Image description
                type: string
                required: true
              - name: caption
                label: Short caption
                type: text
                required: false
              - name: fit
                label: Photo sizing
                type: select
                required: true
                options:
                  values:
                    - label: Show the whole photo
                      value: contain
                    - label: Fill the frame (may crop)
                      value: cover
              - name: position
                label: Photo alignment
                type: select
                required: true
                options:
                  values:
                    - center
                    - top
                    - bottom
